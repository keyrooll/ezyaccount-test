<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EzyAccount</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <script>window._gisLoaded=false;window.onGISLoaded=function(){window._gisLoaded=true;if(typeof _doGISInit==='function')_doGISInit();}</script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.onGISLoaded()"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }
    .main-logo {
      width: 200px;
      height: auto;
      margin-bottom: 12px;
    }
    .login-brand {
      font-size: 32px; font-weight: 800; color: #1a7a4a;
      margin-bottom: 4px; letter-spacing: -0.5px;
    }
    .login-brand span { color: #333; }
    .login-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 36px;
      text-align: center;
    }
    .btn-google {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 14px;
      padding: 14px 24px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #111;
      width: 100%;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      transition: box-shadow .2s;
    }
    .btn-google:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .google-svg { width: 22px; height: 22px; flex-shrink: 0; }
    .kekal-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 18px; cursor: pointer;
      font-size: 14px; color: #6b7280;
    }
    .kekal-row input { width: 18px; height: 18px; accent-color: #1a7a4a; cursor: pointer; }
    .login-loading {
      display: none;
      font-size: 13px;
      color: #1a7a4a;
      margin-top: 16px;
    }

    /* ── COMPANY SCREEN ── */
    #companyScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
    }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
      margin-bottom: 24px;
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
    }
    .user-avatar-fallback {
      width: 36px; height: 36px; border-radius: 50%;
      background: #1a7a4a; color: #fff;
      display: none; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    .user-bar-name { font-size: 14px; font-weight: 600; color: #111; }
    .user-bar-email { font-size: 11px; color: #888; }
    .user-bar-right { margin-left: auto; }
    .btn-logout {
      font-size: 12px; font-weight: 500; color: #dc2626;
      background: none; border: 1px solid #dc2626;
      border-radius: 8px; padding: 5px 10px; cursor: pointer;
    }
    .btn-logout:hover { background: #fee2e2; }
    .company-head {
      text-align: center;
      margin-bottom: 20px;
    }
    .main-logo-sm {
      width: 120px;
      height: auto;
      margin-bottom: 6px;
    }
    .company-head p { font-size: 13px; color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 14px;
      width: 100%;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px 12px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      border: 2px solid transparent;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    /* Logo wrapper — coloured background so white logos show up */
    .card-logo-wrap {
      width: 56px; height: 56px;
      border-radius: 12px;
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card-logo {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .card-emoji {
      font-size: 28px;
      display: none; /* shown via JS if img fails */
    }
    .card .name {
      font-size: 13px;
      font-weight: 600;
      color: #1a3a2a;
    }
    .card .sub {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    /* ── LOADING ── */
    #loadingScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #1a7a4a;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #d1fae5;
      border-top-color: #1a7a4a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Atom loader: 3 tilted orbits + 3 round glossy balls (offset-path keeps them round). */
    .atomldr{width:120px;height:120px;position:relative}
    .atomldr .orb{position:absolute;inset:0}
    .atomldr .orb.o2{transform:rotate(60deg)}
    .atomldr .orb.o3{transform:rotate(120deg)}
    .atomldr .rng{display:none}
    .atomldr .el{position:absolute;width:14px;height:14px;border-radius:50%;
      offset-path:path("M 8 60 A 52 18 0 1 1 112 60 A 52 18 0 1 1 8 60");offset-rotate:0deg;
      background:radial-gradient(circle at 32% 27%, #ececec 0%, #8a8a8a 38%, #171717 100%);
      box-shadow:inset -2px -2px 4px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.25);
      animation:atomride 1.9s linear infinite, atomdepth 1.9s linear infinite}
    .atomldr .orb.o2 .el{animation-delay:-.63s,-.63s}
    .atomldr .orb.o3 .el{animation-delay:-1.26s,-1.26s}
    @keyframes atomride{to{offset-distance:100%}}
    /* Depth only (no scaling — balls stay one size): front half of the orbit sits above the
       logo (z-index 6 > logo's 5), back half sits behind it (z-index 4). Flip points are at the
       ellipse's far left/right extremes, so the swap never happens over the logo. */
    @keyframes atomdepth{0%,49.9%{z-index:6}50%,100%{z-index:4}}
    .atomldr .nuc{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px;border-radius:50%;z-index:5;
      background:radial-gradient(circle at 32% 27%, #6fd39a 0%, #1a7a4a 55%, #0f4a2c 100%);
      box-shadow:inset -2px -2px 4px rgba(0,0,0,.35)}
    /* Login: the main logo sits in the centre of the atom; balls stay one size and orbit in front of it. */
    .login-atom{transform:scale(.9);margin:2px 0 14px}
    .atomldr .main-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:72px;height:72px;object-fit:contain;border-radius:50%;background:#f9fafb;margin:0;z-index:5}

    .footer {
      margin-top: 36px;
      font-size: 11px;
      color: #bbb;
    }

    /* ── ATOM LOGO (createAtomLogo) slots ── */
    .login-atom-wrap{ line-height:0; }
    .atom-slot{ margin:2px 0 14px; line-height:0; }
    .atom-slot-sm{ margin:0 0 4px; line-height:0; }

    /* ── DARK AUTH THEME — aktif masa login/loading sahaja, supaya glow atom nampak ── */
    body.auth-dark{ background:#04060c; }
    body.auth-dark .login-brand span{ color:#e8edf3; }
    body.auth-dark .login-title{ color:#93a4b8; }
    body.auth-dark .kekal-row{ color:#93a4b8; }
    body.auth-dark .login-loading{ color:#7fd1a0; }
    body.auth-dark .footer{ color:#5b6676; }
    body.auth-dark #loadingScreen{ color:#cfe4ff; }
    body.auth-dark #loginFallback{ color:#5ec98f; }
    body.auth-dark #loginFallback span{ color:#e8edf3; }
  </style>
</head>
<body class="auth-dark">

<script>
/* ============================================================
   EzyStaff Atom Logo — komponen vanilla JS (dari ezystaff-atom-logo.html)
   Geometri, warna & timing KEKAL 100% sama. Perlu browser moden (offset-path).
   Guna: createAtomLogo({ size:200, tone:'dark'|'light', logoSrc:'...' })
   ============================================================ */
var _atomKF = {};
function _injectAtomKF(N){
  if (_atomKF[N]) return; _atomKF[N] = 1;
  var s = _atomKF.spin ? '' : '@keyframes la-spin{to{offset-distance:100%}}';
  _atomKF.spin = 1;
  for (var j = 0; j < N; j++){
    var ob = Math.pow(1 - j / N, 1.1).toFixed(3);
    s += '@keyframes la-bf'+N+'_'+j+'{0%,47%{opacity:'+ob+'}50%,97%{opacity:0}100%{opacity:'+ob+'}}';
    s += '@keyframes la-ff'+N+'_'+j+'{0%,47%{opacity:0}50%,97%{opacity:'+ob+'}100%{opacity:0}}';
  }
  var st = document.createElement('style'); st.textContent = s; document.head.appendChild(st);
}

function createAtomLogo(opts){
  opts = opts || {};
  var size = opts.size || 200;
  var tone = opts.tone || 'light';
  var DUR  = (opts.speed || 2.1) + 's';
  var N    = opts.tailLength || 39;
  var ratio= opts.tilt != null ? opts.tilt : 0.30;
  var RX   = opts.diameter || 90;
  var CFG  = {3:[30,90,150], 4:[0,45,90,135], 5:[0,36,72,108,144]};
  var ANG  = CFG[opts.balls || 3] || CFG[3];

  var BASE = 340, C = 170, RY = Math.round(RX * ratio), LOGO_D = 148, HEAD = 9, SEGLAG = 0.011;
  var k = size / 230;
  var h = Math.pow(RX - RY, 2) / Math.pow(RX + RY, 2);
  var L = Math.PI * (RX + RY) * (1 + 3 * h / (10 + Math.sqrt(4 - 3 * h)));
  var segW = (L * SEGLAG * 1.35).toFixed(1);
  var PATH = "path('M "+(C-RX)+","+C+" a "+RX+","+RY+" 0 1,1 "+(RX*2)+",0 a "+RX+","+RY+" 0 1,1 -"+(RX*2)+",0')";
  var col = (tone === 'dark')
    ? { head:'#f6fcff', tail:'#92ccff', glow:'rgba(90,200,255,.9)' }
    : { head:'#15306e', tail:'#2f55a6', glow:'transparent' };

  _injectAtomKF(N);

  function layer(which){
    var box = document.createElement('div'); box.style.cssText = 'position:absolute;inset:0';
    ANG.forEach(function(a, i){
      var o = document.createElement('div');
      o.style.cssText = 'position:absolute;inset:0;transform:rotate('+a+'deg)';
      var phase = i / ANG.length;
      for (var j = 0; j < N; j++){
        var delay = 'calc('+DUR+' * '+(-(phase - j*SEGLAG)).toFixed(4)+')';
        var fade  = 'la-'+(which === 'back' ? 'bf' : 'ff')+N+'_'+j;
        var common = 'position:absolute;top:0;left:0;offset-path:'+PATH+';'
          + 'animation:la-spin '+DUR+' linear infinite, '+fade+' '+DUR+' linear infinite;'
          + 'animation-delay:'+delay+','+delay+';';
        var e = document.createElement('div');
        if (j === 0){
          e.style.cssText = common + 'width:'+HEAD+'px;height:'+HEAD+'px;border-radius:50%;background:'+col.head+';offset-rotate:0deg;'
            + (tone === 'dark' ? 'box-shadow:0 0 '+(HEAD*1.3)+'px '+col.glow+',0 0 '+(HEAD*0.5)+'px '+col.glow+';' : '');
        } else {
          e.style.cssText = common + 'width:'+segW+'px;height:3px;border-radius:2px;background:'+col.tail+';offset-rotate:auto;';
        }
        o.appendChild(e);
      }
      box.appendChild(o);
    });
    return box;
  }

  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:'+size+'px;height:'+size+'px;overflow:hidden';
  var inner = document.createElement('div');
  inner.style.cssText = 'position:absolute;top:50%;left:50%;width:'+BASE+'px;height:'+BASE+'px;margin:'+(-BASE/2)+'px 0 0 '+(-BASE/2)+'px;transform:scale('+k+')';
  wrap.appendChild(inner);

  inner.appendChild(layer('back'));

  var nuc = document.createElement('div');
  nuc.style.cssText = 'position:absolute;top:50%;left:50%;width:'+LOGO_D+'px;height:'+LOGO_D+'px;margin:'+(-LOGO_D/2)+'px 0 0 '+(-LOGO_D/2)+'px;'
    + (tone === 'dark' ? 'filter:drop-shadow(0 0 18px rgba(110,170,70,.45));' : '');
  if (opts.logoSrc){
    var img = document.createElement('img');
    img.src = opts.logoSrc; img.alt = 'logo';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block';
    nuc.appendChild(img);
  } else {
    nuc.style.cssText += 'border-radius:50%;background:#5E8C3A;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:78px;font-family:system-ui';
    nuc.textContent = 'e';
  }
  inner.appendChild(nuc);

  inner.appendChild(layer('front'));
  return wrap;
}
</script>

<script>
(function(){
  const EMAIL_WORKER='https://ezyaccount-staff.keyrooll.workers.dev';
  const tgl=document.getElementById('emailLoginToggle'), frm=document.getElementById('emailLoginForm');
  if(tgl&&frm) tgl.onclick=()=>{ frm.style.display = frm.style.display==='none'?'block':'none'; const e=document.getElementById('elEmail'); if(e&&frm.style.display!=='none') e.focus(); };
  const btn=document.getElementById('elBtn');
  const msgEl=document.getElementById('elMsg');
  const show=(t,c)=>{ if(!msgEl)return; msgEl.style.display='block'; msgEl.style.color=c; msgEl.textContent=t; };
  async function doEmailLogin(){
    const email=(document.getElementById('elEmail').value||'').trim(), password=document.getElementById('elPass').value;
    if(!email||!password){ show('Isi email & password','#b91c1c'); return; }
    btn.disabled=true; show('Memeriksa…','#b45309');
    try{
      const r=await fetch(EMAIL_WORKER+'/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
      const d=await r.json();
      if(r.ok && d.token){
        try{ localStorage.setItem('ezy_email_jwt', d.token); }catch(e){}
        const roles=(d.staff&&d.staff.roles)||{};
        if(Object.keys(roles).length){ show('Berjaya ✓','#0f4a2c'); showCompanyScreenEmail(d.staff); }
        else { show('Akaun belum diberi akses oleh admin','#b91c1c'); btn.disabled=false; }
      } else if(r.status===403 && d.pending){ show('Akaun menunggu kelulusan admin.','#b45309'); btn.disabled=false; }
      else { show(d.error||'Gagal log masuk','#b91c1c'); btn.disabled=false; }
    }catch(e){ show('Masalah sambungan','#b91c1c'); btn.disabled=false; }
  }
  if(btn) btn.onclick=doEmailLogin;
  const pass=document.getElementById('elPass');
  if(pass) pass.addEventListener('keydown',e=>{ if(e.key==='Enter') doEmailLogin(); });
})();
</script>

// ===== Stay logged in: silently top up the 1-hour Google token so nobody re-authorises =====
let _authPhase='entering';   // 'entering' = logging in, 'active' = already past login
let _renewTimer=null, _renewInFlight=false;
function scheduleSilentRenew(expiry){
  if(_renewTimer) clearTimeout(_renewTimer);
  const ms=Math.max(30000,(expiry-Date.now())-5*60000); // ~5 min before it expires
  _renewTimer=setTimeout(()=>silentRenew(),ms);
}
function silentRenew(){
  if(!gisReady||!tokenClient||_renewInFlight) return;
  _renewInFlight=true;
  try{ tokenClient.requestAccessToken({prompt:''}); }  // '' = no popup while a Google session exists
  catch(e){ _renewInFlight=false; onRenewFail(); }
}
function onRenewFail(){ const l=document.getElementById('loginLoading'); if(l) l.style.display='none'; }

async function handleTokenResponse(resp){
  _renewInFlight=false;
  if(resp.error){ onRenewFail(); return; }
  currentToken=resp.access_token;
  const expiry=Date.now()+(resp.expires_in||3599)*1000;
  const kekalEl=document.getElementById('kekalCheck');
  const kekal=kekalEl?kekalEl.checked:true;
  // Always save token — localStorage if kekal, sessionStorage if not
  if(kekal){
    lsSet('ezy_landing_token',currentToken);
    lsSet('ezy_landing_expiry',expiry);
    lsSet('ezy_kekal',true);
  } else {
    // Session only — cleared when browser closes
    sessionStorage.setItem('ezy_sess_token',currentToken);
    sessionStorage.setItem('ezy_sess_expiry',String(expiry));
  }
  scheduleSilentRenew(expiry);
  if(_authPhase==='active') return; // background refresh — stay where we are
  _authPhase='active';
  showScreen('loadingScreen');
  await fetchUser();
}

async function fetchUser(){
  try{
    const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{Authorization:'Bearer '+currentToken}});
    const u=await r.json();
    if(!u||!u.email)throw new Error('no email');
    lsSet('ezy_user',u);
    // Also save token to sessionStorage so app.html can pick it up even without kekal
    const expiry=Number(sessionStorage.getItem('ezy_sess_expiry')||0)||
                 lsGet('ezy_landing_expiry',0);
    sessionStorage.setItem('ezy_sess_token', currentToken);
    sessionStorage.setItem('ezy_sess_expiry', String(expiry||Date.now()+3599000));
    showCompanyScreen(u);
  }catch(e){
    console.error(e);
    // A transient userinfo failure right after a valid token must NOT bounce the user back to login.
    const cached=lsGet('ezy_user',null);
    if(cached&&cached.email){ showCompanyScreen(cached); return; }
    showScreen('loginScreen');
  }
}

function autoLogin(){
  if(emailLandingAutoLogin()) return;   // returning email staff → straight to their assigned pages
  const user=lsGet('ezy_user',null);
  if(!user)return;
  // Check localStorage (kekal)
  const token1=lsGet('ezy_landing_token',null);
  const expiry1=lsGet('ezy_landing_expiry',0);
  // Check sessionStorage (session only)
  const token2=sessionStorage.getItem('ezy_sess_token');
  const expiry2=Number(sessionStorage.getItem('ezy_sess_expiry')||0);
  
  let token=null, expiry=0;
  if(token1&&expiry1>Date.now()){token=token1;expiry=expiry1;}
  else if(token2&&expiry2>Date.now()){token=token2;expiry=expiry2;}

  if(token&&user){
    currentToken=token; _authPhase='active';
    showCompanyScreen(user);
    scheduleSilentRenew(expiry);
    return;
  }
  // Token expired but the user is remembered → get a fresh one SILENTLY instead of a re-login.
  _authPhase='entering';
  if(gisReady&&tokenClient) silentRenew();
  // else: onGISLoaded()/_doGISInit() calls autoLogin() again once GIS is ready.
}

// Roles this user has (from the loaded registry): {companyId: role} for non-empty roles only.
function userRolesFor(email){
  const rows=_registry.rows||[];            // rows are normalised to REGISTRY_HEADER order (Email = col 0)
  const em=(email||'').toString().trim().toLowerCase();
  const mine=rows.filter(r=>(r[0]||'').toString().trim().toLowerCase()===em);
  if(!mine.length) return {};
  // Merge across duplicate rows for the same email (a stray blank "pending" row must not shadow the
  // real one) — take the first non-empty role per company.
  const VALID=['staff','manager','accountant','super_admin'];
  const roles={};
  GROUP_COMPANIES.forEach(c=>{
    const ci=REGISTRY_HEADER.indexOf(c.id);
    for(const row of mine){
      const v=(row[ci]||'').toString().trim();
      // Only accept a real role value — this rejects a stray non-role cell (e.g. a JoinedAt date
      // that leaked into a company column through some past misalignment) instead of granting access.
      if(v && VALID.includes(v.toLowerCase())){ roles[c.id]=v; break; }
    }
  });
  return roles;
}

    _registry.rows.push(row);

function _emJwt(){ try{ return localStorage.getItem('ezy_email_jwt'); }catch(e){ return null; } }
function _emPayload(t){ try{ return JSON.parse(atob(String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }catch(e){ return null; } }
function emailLandingAutoLogin(){

function isSuperAdmin(){ const u=lsGet('ezy_user',{}); return (u.email||'').toLowerCase()===SUPER_ADMIN; }

async function loadRegistry(){
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1:Z`,{headers:{Authorization:'Bearer '+currentToken}});
  const d=await r.json();
  // readError distinguishes "couldn't read the sheet" (permission/network) from "sheet is empty".
  // Only the former should stop us from auto-registering a pending row.
  if(d.error){ _registry={header:REGISTRY_HEADER.slice(),rows:[],readError:true}; return _registry; }
  if(!d.values||!d.values.length){ _registry={header:REGISTRY_HEADER.slice(),rows:[],readError:false}; return _registry; }
  // Remap every row from the sheet's OWN column order into canonical REGISTRY_HEADER order, matched
  // by header NAME. Downstream code indexes by REGISTRY_HEADER; without this, adding companies
  // (ezycashier/ezydurianhq) or any column reorder makes positional reads land on the wrong column
  // and roles look empty. After the next save the sheet is rewritten in canonical order.
  const actual=d.values[0].map(h=>(h||'').toString().trim());
  const rows=d.values.slice(1).filter(x=>x[0]).map(rr=>REGISTRY_HEADER.map(col=>{
    const i=actual.findIndex(h=>h.toLowerCase()===col.toLowerCase());
    return (i>=0 && rr[i]!==undefined) ? rr[i] : '';
  }));
  _registry={header:REGISTRY_HEADER.slice(), rows, readError:false};
  return _registry;
}

      return `<span onclick="toggleEmBranch('${email.replace(/'/g,"\\'")}','${co}','${b.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')" style="display:inline-block;padding:3px 9px;margin:2px;border-radius:14px;cursor:pointer;font-size:11px;border:1px solid ${on?'#16a34a':'#e5e7eb'};background:${on?'#16a34a':'#fff'};color:${on?'#fff':'#374151'}">${b.replace(/</g,'&lt;')}</span>`;
    }).join('')||'<span style="font-size:11px;color:#9ca3af">(tiada branch)</span>';
    const note = sel.length? `<span style="font-size:10px;color:#16a34a;margin-left:6px">${sel.length} dipilih</span>` : '<span style="font-size:10px;color:#9ca3af;margin-left:6px">(semua branch)</span>';
    return `<div style="margin:6px 0"><div style="font-size:11px;font-weight:700;color:#2563eb;margin-bottom:2px">${_coName(co)}${note}</div><div>${chips}</div></div>`;
  }).join('');
}
function toggleEmBranchRow(email){
  const row=document.getElementById('embrRow_'+_emKey(email)); if(row) row.style.display=(row.style.display==='none'?'table-row':'none');
}
function toggleEmBranch(email,co,branch){
  const s=(_emailStaff||[]).find(x=>x.email===email); if(!s) return;
  if(!s.branches) s.branches={};
  let arr=s.branches[co]?s.branches[co].slice():[];
  if(arr.includes(branch)) arr=arr.filter(b=>b!==branch); else arr.push(branch);
  if(arr.length) s.branches[co]=arr; else delete s.branches[co];
  s._dirty=true;
  const cell=document.getElementById('embrPanel_'+_emKey(email)); if(cell) cell.innerHTML=emBranchPanel(s);
}
// Per-company role edits for email staff are buffered locally, then saved on "Simpan Semua"
// (same as Google staff). Each change POSTs a {roles} map to the worker.
function updateEmailRole(email, companyId, role){
  const s=(_emailStaff||[]).find(x=>x.email===email); if(!s) return;
  if(!s.roles) s.roles={};
  if(role) s.roles[companyId]=role; else { delete s.roles[companyId]; if(s.branches) delete s.branches[companyId]; }
  s._dirty=true;
  // Role added/removed → refresh the branch panel so the company appears/disappears there too.
  const cell=document.getElementById('embrPanel_'+_emKey(email)); if(cell) cell.innerHTML=emBranchPanel(s);
}
async function removeEmailStaff(email){
  if(!confirm('Tolak / tarik semua akses akaun email '+email+'?')) return;
  try{
    const r=await fetch(STAFF_WORKER+'/staff/admin/approve',{method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({email,status:'rejected',roles:{}})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); alert(d.error||'Gagal'); return; }
  }catch(e){ alert('Masalah sambungan'); return; }
  await fetchEmailStaff(); renderStaffTable();
}
async function saveEmailStaffRoles(){
  const dirty=(_emailStaff||[]).filter(s=>s._dirty);
  for(const s of dirty){
    try{
      await fetch(STAFF_WORKER+'/staff/admin/approve',{method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({email:s.email,roles:s.roles||{},branches:s.branches||{}})});
      s._dirty=false;
    }catch(e){ console.warn('save email role',e); }
  }
}
async function approveEmailStaff(email, status){
  let company='',branch='';
  if(status==='approved'){
    const co=document.querySelector('.emCo[data-email="'+CSS.escape(email)+'"]');
    const br=document.querySelector('.emBr[data-email="'+CSS.escape(email)+'"]');
    company=co?co.value:''; branch=br?br.value:'';
    if(!company){ alert('Pilih syarikat untuk '+email+' dahulu'); return; }
  } else { if(!confirm('Tolak / tarik balik '+email+'?')) return; }
  try{
    const r=await fetch(STAFF_WORKER+'/staff/admin/approve',{method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({email,status,company,branch})});
    const d=await r.json();
    if(!r.ok){ alert(d.error||'Gagal'); return; }
  }catch(e){ alert('Masalah sambungan'); return; }
  await fetchEmailStaff(); renderStaffTable();
}

function renderStaffTable(){
  const rows=_registry.rows;
  let html=`<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr style="background:#f9fafb;position:sticky;top:0">
      <th style="padding:8px;text-align:left;border-bottom:1px solid #e5e7eb;min-width:150px">Email / Nama</th>
      ${GROUP_COMPANIES.map(c=>`<th style="padding:8px;text-align:center;border-bottom:1px solid #e5e7eb;font-size:11px">${c.name}</th>`).join('')}
      <th style="border-bottom:1px solid #e5e7eb"></th>
    </tr></thead><tbody>`;
  if(!rows.length) html+=`<tr><td colspan="${GROUP_COMPANIES.length+2}" style="padding:20px;text-align:center;color:#6b7280">Tiada staff lagi — tambah di bawah</td></tr>`;
  rows.forEach((row,i)=>{
    const hasRole=GROUP_COMPANIES.some(c=>(row[colOf(c.id)]||'').toString().trim());
    html+=`<tr style="border-bottom:1px solid #f0f0f0${hasRole?'':';background:#fffbeb'}">
      <td style="padding:6px 8px"><div style="font-weight:600">${(row[0]||'').replace(/</g,'&lt;')} ${hasRole?'':'<span style="font-size:10px;color:#d97706;font-weight:600">⏳ pending</span>'}</div><div style="color:#6b7280;font-size:11px">${(row[1]||'').replace(/</g,'&lt;')}</div></td>
      ${GROUP_COMPANIES.map(c=>{const ci=colOf(c.id);const val=(row[ci]||'').toLowerCase();return `<td style="padding:4px;text-align:center"><select onchange="updateCell(${i},'${c.id}',this.value)" style="font-size:11px;padding:3px;border:1px solid #e5e7eb;border-radius:5px">${ROLE_OPTS.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td>`;}).join('')}
      <td style="padding:4px;text-align:center"><button onclick="removeStaff(${i})" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:14px">✕</button></td>
    </tr>`;
  });
  // Email/password staff — rendered in the SAME table so they are managed together.
  if(typeof _emailStaffErr!=='undefined' && _emailStaffErr==='notadmin'){
    html+=`<tr><td colspan="${GROUP_COMPANIES.length+2}" style="padding:10px;color:#b45309;font-size:11px;background:#fffbeb">📧 Staff email: akaun Google ini bukan admin backend (keyrooll@gmail.com) — tak dapat urus staff email di sini.</td></tr>`;
  } else if(typeof _emailStaff!=='undefined' && _emailStaff.length){
    html+=`<tr><td colspan="${GROUP_COMPANIES.length+2}" style="padding:8px;font-size:11px;font-weight:700;color:#2563eb;background:#eff6ff">📧 STAFF EMAIL/PASSWORD (${_emailStaff.length}) — login guna email, assign syarikat di sini</td></tr>`;
    _emailStaff.slice().sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)).forEach(s=>{ html+=emailStaffRow(s); });
  }
  html+=`</tbody></table>`;
  document.getElementById('staffTableWrap').innerHTML=html;
}
function updateCell(rowIdx, companyId, role){
  const ci=colOf(companyId);
  while(_registry.rows[rowIdx].length<=ci) _registry.rows[rowIdx].push('');
  _registry.rows[rowIdx][ci]=role;
}
function removeStaff(rowIdx){
  if(!confirm('Buang staff ini dari registry?')) return;
  _registry.rows.splice(rowIdx,1);
  renderStaffTable();
}
function addStaffRow(){
  const email=(document.getElementById('newStaffEmail').value||'').trim().toLowerCase();
  const name=(document.getElementById('newStaffName').value||'').trim();
  if(!email||!email.includes('@')){ alert('Sila masukkan email yang sah'); return; }
  if(_registry.rows.some(r=>(r[0]||'').toLowerCase()===email)){ alert('Email ni dah ada dalam senarai'); return; }
  const row=new Array(REGISTRY_HEADER.length).fill('');
  row[0]=email; row[1]=name; row[REGISTRY_HEADER.length-1]=new Date().toLocaleDateString('en-GB');
  _registry.rows.push(row);
  document.getElementById('newStaffEmail').value='';
  document.getElementById('newStaffName').value='';
  renderStaffTable();
}
async function saveStaffRegistry(){
  const btn=document.getElementById('btnSaveRegistry');
  btn.disabled=true; btn.textContent='Menyimpan...';
  try{ await saveRegistry(); await saveEmailStaffRoles(); btn.textContent='✅ Disimpan'; await fetchEmailStaff(); renderStaffTable(); setTimeout(()=>{btn.textContent='Simpan Semua';btn.disabled=false;},1500); }
  catch(e){ alert('Gagal simpan: '+e.message); btn.textContent='Simpan Semua'; btn.disabled=false; }
}

function showScreen(id){
  ['loginScreen','loadingScreen','companyScreen'].forEach(s=>{
    document.getElementById(s).style.display=(s===id)?'flex':'none';
  });
  document.body.classList.toggle('auth-dark', id==='loginScreen'||id==='loadingScreen');
}
</script>
</body>
